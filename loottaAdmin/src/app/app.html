<header class="bar">
  <div class="inner">
    <a class="logo" routerLink="/products">
      <span class="mark">L</span>
      <span>Lootta<b>Tech</b> <em>Admin</em></span>
    </a>

    <nav>
      <a routerLink="/products" routerLinkActive="on">Products</a>
      <a routerLink="/orders" routerLinkActive="on">
        Orders
        @if (notifier.pendingCount() > 0) {
          <span class="pill">{{ notifier.pendingCount() }}</span>
        }
      </a>
      <a class="disabled" title="Coming next">Customers</a>
    </nav>

    <div class="status" [class.off]="!notifier.connected()">
      <span class="dot"></span>
      {{ notifier.connected() ? 'Live' : 'API offline' }}
    </div>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>

<!-- New orders arriving while the admin works. Polled every 10 seconds. -->
@if (notifier.unseenCount() > 0) {
  <aside class="toasts" role="status" aria-live="polite">
    @for (order of notifier.unseen(); track order.id) {
      <button type="button" class="toast" (click)="open(order)">
        <span class="ding">🔔</span>
        <span class="body">
          <b>New order {{ order.orderNumber }}</b>
          <span>{{ order.customerName }} · {{ order.itemCount }} item(s) ·
            {{ order.totalPrice | currency: 'USD' : 'symbol' : '1.2-2' }}</span>
        </span>
      </button>
    }
  </aside>
}
