<header class="bar">
  <div class="inner">
    <a class="logo" routerLink="/" aria-label="LoottaTech home">
      <span class="mark">L</span>
      <span class="word">Lootta<b>Tech</b></span>
    </a>

    <form class="search" (ngSubmit)="search()" role="search">
      <label class="sr-only" for="q">Search second-hand electronics</label>
      <input
        id="q"
        name="q"
        type="search"
        placeholder="Search iPhone, ThinkPad, camera…"
        [ngModel]="term()"
        (ngModelChange)="term.set($event)"
        autocomplete="off"
      />
      <button type="submit">Search</button>
    </form>

    <nav class="actions">
      <button
        type="button"
        class="icon"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        {{ themeService.theme() === 'dark' ? '☀' : '☾' }}
        <span class="icon-label">{{ themeService.theme() === 'dark' ? 'Light' : 'Dark' }}</span>
      </button>

      @if (users.isLoggedIn()) {
        <a class="icon coins" routerLink="/arcade" title="Lootta Arcade">
          ◎ {{ users.coins() }}
        </a>
        <a class="icon" routerLink="/my-orders">My orders</a>

        <!-- The avatar IS the profile entry. Sign out lives inside. -->
        <a class="avatar" routerLink="/profile" [title]="users.user()?.name ?? 'My profile'">
          {{ initials() }}
        </a>
      } @else {
        <a class="icon" routerLink="/my-orders">My orders</a>
        <a class="icon signin" routerLink="/login">Sign in</a>
      }

      <a class="icon cart" routerLink="/cart">
        Cart
        @if (cart.count() > 0) {
          <span class="badge">{{ cart.count() }}</span>
        }
      </a>
    </nav>
  </div>

  <div class="quick">
    @for (link of quickLinks; track link) {
      <button type="button" (click)="quickSearch(link)">{{ link }}</button>
    }
  </div>
</header>
